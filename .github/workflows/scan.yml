yaml
name: options-momentum-scan

on:
  schedule:
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write            # مطلوب ليعيد البوت حفظ ملف الحالة

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state/top10.json ]; then
            git add state/top10.json
            if git diff --staged --quiet; then
              echo "لا تغيير في الحالة."
            else
              git commit -m "update state [skip ci]"
              git pull --rebase --autostash origin main
              git push
            fi
          else
            echo "لا ملف حالة (السوق مغلق أو لا بيانات) — تخطّي."
          fi
